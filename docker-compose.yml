services:
  api:
    build: .
    container_name: vet_inference_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    container_name: vet_inference_postgres
    environment:
      POSTGRES_DB: vet_inference
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: vet_inference_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vet.local
      PGADMIN_DEFAULT_PASSWORD: Admin12345
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
